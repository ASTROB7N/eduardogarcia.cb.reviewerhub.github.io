<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilibre Kita??</title>
    <!-- Loading a cute font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe6f2; /* Soft pastel pink */
            font-family: 'Nunito', sans-serif;
            overflow: hidden; /* Prevents scrollbars when button moves */
            text-align: center;
        }

        #main-container, #result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 {
            color: #ff4d94;
            font-size: 3.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #fff;
            padding: 0 20px;
        }

        .button-container {
            display: flex;
            gap: 20px;
            position: relative;
        }

        button {
            background-color: #ff66a3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 102, 163, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            outline: none;
        }

        button:hover {
            background-color: #ff4d94;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #yes-btn {
            position: relative;
            transition: left 0.2s ease-out, top 0.2s ease-out;
            z-index: 20;
        }

        /* Hidden class to toggle views */
        .hidden {
            display: none !important;
        }

        /* Adjustments for mobile view */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            button { padding: 12px 30px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <h1>lilibre kita??</h1>
        <div class="button-container">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="result-container" class="hidden">
        <h1>ayaw mo mag palibre 😢😭💔</h1>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const mainContainer = document.getElementById('main-container');
        const resultContainer = document.getElementById('result-container');

        // Function to move the "Yes" button to a random position
        function moveButton() {
            // Calculate random coordinates based on window size
            // Subtract button dimensions so it doesn't go off screen
            const maxX = window.innerWidth - yesBtn.offsetWidth;
            const maxY = window.innerHeight - yesBtn.offsetHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Change position to fixed so it can roam the entire screen
            yesBtn.style.position = 'fixed';
            yesBtn.style.left = `${randomX}px`;
            yesBtn.style.top = `${randomY}px`;
        }

        // Trigger the movement on hover (desktop) or touch (mobile)
        yesBtn.addEventListener('mouseover', moveButton);
        yesBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent accidental clicking while touching
            moveButton();
        });
        
        // Just in case they manage to click it somehow
        yesBtn.addEventListener('click', moveButton);

        // When "No" is clicked, show the sad message
        noBtn.addEventListener('click', () => {
            mainContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
        });
    </script>
</body>
</html>
